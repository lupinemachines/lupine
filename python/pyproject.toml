[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lupine"
version = "2.0.3"
description = "CUDA on any host: server-selected LUPINE shims plus PyTorch adapter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
torch = ["torch"]
auto = ["lupine-auto==2.0.3"]

[project.scripts]
lupine = "lupine.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
lupine-auto = { path = "auto" }

[tool.hatch.build.targets.wheel]
packages = ["lupine"]
# The wheel is pure Python. Every native client — driver, runtime, math
# libraries, NVML — is published by the bound server and resolved at run time,
# so a stray local staging directory must never enter a distribution.
exclude = ["lupine/_libs/**"]

[tool.hatch.build.targets.sdist]
exclude = ["lupine/_libs"]
