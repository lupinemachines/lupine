[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lupine"
version = "3.0.0"
description = "CUDA on any host: server-selected LUPINE client plus PyTorch adapter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
torch = ["torch"]
auto = ["lupine-auto==3.0.0"]

[project.scripts]
lupine = "lupine.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
lupine-auto = { path = "auto" }

[tool.hatch.build.targets.wheel]
packages = ["lupine"]
# Driver and NVML shims are always downloaded from the bound server.
# The Mac wheel hook explicitly includes only its two application dylibs.
# The torch backend extension (lupine/_backend/_C) is built per torch release
# from a checkout and never ships in the pure wheel either.
exclude = ["lupine/_libs/**", "lupine/_backend/_C*", "lupine/_backend/build/**"]

[tool.hatch.build.targets.sdist]
exclude = ["lupine/_libs", "lupine/_backend/_C*", "lupine/_backend/build"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
