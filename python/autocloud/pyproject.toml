[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lupine-autocloud"
version = "2.0.0"
description = "Opt-in Python startup bootstrap for the LUPINE cloud GPU"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["lupine_autocloud"]

[tool.hatch.build.targets.wheel.force-include]
"lupine_autocloud.pth" = "lupine_autocloud.pth"
