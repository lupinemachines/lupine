name: Build macOS Client

on:
  release:
    types: [published]
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CUDA_HEADER_PACKAGE: nvidia-cuda-runtime-cu12
  CUDA_HEADER_VERSION: 12.9.79
  NVML_HEADER_PACKAGE: nvidia-nvml-dev-cu12
  NVML_HEADER_VERSION: 12.9.79

jobs:
  build:
    name: macOS client / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: brew install libnghttp2 ninja openssl@3

      - name: Download CUDA headers
        run: |
          set -euo pipefail
          mkdir -p cuda-wheel cuda-sdk
          python3 -m pip download \
            --dest cuda-wheel \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --implementation py \
            --python-version 3 \
            --abi none \
            --no-deps \
            "${CUDA_HEADER_PACKAGE}==${CUDA_HEADER_VERSION}" \
            "${NVML_HEADER_PACKAGE}==${NVML_HEADER_VERSION}"
          python3 -m zipfile -e \
            "cuda-wheel/nvidia_cuda_runtime_cu12-${CUDA_HEADER_VERSION}-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" \
            cuda-sdk
          python3 -m zipfile -e \
            "cuda-wheel/nvidia_nvml_dev_cu12-${NVML_HEADER_VERSION}-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" \
            nvml-sdk
          test -f cuda-sdk/nvidia/cuda_runtime/include/cuda.h
          test -f nvml-sdk/nvidia/nvml_dev/include/nvml.h

      - name: Configure client-only build
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix libnghttp2);$(brew --prefix openssl@3)" \
            -DLUPINE_CUDA_INCLUDE_DIR="$PWD/cuda-sdk/nvidia/cuda_runtime/include" \
            -DLUPINE_NVML_INCLUDE_DIR="$PWD/nvml-sdk/nvidia/nvml_dev/include"

      - name: Build client dylibs
        run: >
          cmake --build build --parallel
          --target lupine_cuda_client lupine_nvml

      - name: Verify dylib
        run: |
          set -euo pipefail
          test -f build/libcuda.dylib
          test -f build/libnvidia-ml.dylib
          test "$(lipo -archs build/libcuda.dylib)" = "${{ matrix.arch }}"
          test "$(lipo -archs build/libnvidia-ml.dylib)" = "${{ matrix.arch }}"
          nm -gjU build/libcuda.dylib > build/libcuda.exports
          nm -gjU build/libnvidia-ml.dylib > build/libnvidia-ml.exports
          grep -qx '_cuInit' build/libcuda.exports
          grep -qx '_cuGetProcAddress' build/libcuda.exports
          grep -qx '_nvmlInit_v2' build/libnvidia-ml.exports
          otool -L build/libcuda.dylib > build/libcuda.dependencies
          otool -L build/libnvidia-ml.dylib > build/libnvidia-ml.dependencies
          if awk 'FNR > 1' build/*.dependencies | grep -E 'libcuda|libcudart|libnvidia-ml'; then
            echo 'A client dylib unexpectedly links an NVIDIA library' >&2
            exit 1
          fi
          CUDA_DYLIB_PATH="$PWD/build/libcuda.dylib" \
          NVML_DYLIB_PATH="$PWD/build/libnvidia-ml.dylib" \
          python3 - <<'PY'
          import ctypes
          import os

          cuda = ctypes.CDLL(os.environ["CUDA_DYLIB_PATH"])
          nvml = ctypes.CDLL(os.environ["NVML_DYLIB_PATH"])
          assert cuda.cuInit
          assert cuda.cuGetProcAddress
          assert nvml.nvmlInit_v2
          PY

      - name: Collect client artifact
        run: |
          set -euo pipefail
          asset="lupine-client-cuda-${CUDA_HEADER_VERSION}-macos-${{ matrix.arch }}"
          out="artifacts/${asset}"
          mkdir -p "$out"
          cp build/libcuda.dylib "$out/libcuda.dylib"
          cp build/libnvidia-ml.dylib "$out/libnvidia-ml.dylib"
          (cd "$out" && shasum -a 256 libcuda.dylib libnvidia-ml.dylib > SHA256SUMS)
          (cd "$out" && zip -r "../${asset}.zip" .)

      - name: Upload client artifact
        uses: actions/upload-artifact@v7
        with:
          name: lupine-client-cuda-${{ env.CUDA_HEADER_VERSION }}-macos-${{ matrix.arch }}
          path: artifacts/lupine-client-cuda-${{ env.CUDA_HEADER_VERSION }}-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="artifacts/lupine-client-cuda-${CUDA_HEADER_VERSION}-macos-${{ matrix.arch }}.zip"
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "$asset" \
            --repo "${{ github.repository }}" \
            --clobber
