name: Publish PyTorch Worker Image

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - deploy/Dockerfile.pytorch-worker
      - python/lupine/_backend/**
      - python/lupine/_worker.py
      - .github/workflows/publish-pytorch-worker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Worker image (torch ${{ matrix.torch.version }} ${{ matrix.torch.index }} / ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        torch:
          - version: 2.12.1
            index: cu130
        platform:
          - arch: arm64
            docker_platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            docker_platform: linux/amd64
            runner: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # lupine._guest selects torch<release>-cu<xyz>; the per-arch tag keeps
      # the two platform builds apart until a manifest joins them.
      - name: Build and publish worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.pytorch-worker
          platforms: ${{ matrix.platform.docker_platform }}
          push: true
          build-args: |
            TORCH_VERSION=${{ matrix.torch.version }}
            TORCH_CUDA_INDEX=${{ matrix.torch.index }}
          tags: ghcr.io/${{ github.repository_owner }}/lupine-pytorch-worker:torch${{ matrix.torch.version }}-${{ matrix.torch.index }}-${{ matrix.platform.arch }}

  manifest:
    name: Multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the platform images
        run: |
          image=ghcr.io/${{ github.repository_owner }}/lupine-pytorch-worker
          docker buildx imagetools create -t "$image:torch2.12.1-cu130" \
            "$image:torch2.12.1-cu130-arm64" "$image:torch2.12.1-cu130-amd64"
