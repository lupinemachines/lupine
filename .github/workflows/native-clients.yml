name: Native Clients

concurrency:
  group: native-clients-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source revision to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  macos-driver:
    name: Bootstrap ARM64 macOS driver interface
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: astral-sh/setup-uv@v5
      - name: Install build dependencies
        run: brew install libnghttp2 ninja
      - name: Stage CUDA headers
        run: python3 cmake/fetch_cuda_headers.py cuda-sdk
      - name: Build native driver
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUPINE_BUILD_SERVER=OFF \
            -DLUPINE_BUILD_HIP=OFF \
            -DCMAKE_PREFIX_PATH="$PWD/cuda-sdk/nvidia/cu13"
          cmake --build build --parallel --target lupine_cuda_client lupine_nvml
      - name: Inspect actual native driver exports
        run: >
          uv run --project third_party/machso python third_party/machso/inspect_native.py
          build/libcuda.dylib build/native-cuda-interface.json --soname libcuda.so.1
      - uses: actions/upload-artifact@v7
        with:
          name: lupine-macos-driver-bootstrap
          path: |
            build/libcuda.dylib
            build/libnvidia-ml.dylib
            build/native-cuda-interface.json
            cuda-sdk/nvidia/cu13/include
          if-no-files-found: error
          retention-days: 3

  macos-runtime-input:
    name: Prepare ARM64 CUDA runtime
    needs: macos-driver
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: astral-sh/setup-uv@v5
      - name: Install ARM64 Linux ABI inputs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang gpgv ubuntu-keyring gcc-aarch64-linux-gnu libc6-arm64-cross libgcc-s1-arm64-cross libstdc++6-arm64-cross
      - name: Test vendored compiler
        working-directory: third_party/machso
        run: uv run --extra headers python -m unittest discover -s tests -q
      - uses: actions/download-artifact@v8
        with:
          name: lupine-macos-driver-bootstrap
      - name: Derive Linux ABI signatures from CUDA headers
        run: >
          uv run --project third_party/machso --extra headers python third_party/machso/inspect_headers.py
          build/native-cuda-interface.json build/native-cuda-typed-interface.json
          --header cuda-sdk/nvidia/cu13/include/cuda.h
          -I cuda-sdk/nvidia/cu13/include --sysroot /usr/aarch64-linux-gnu
      - name: Compile runtime into portable native inputs
        run: >
          uv run --project third_party/machso --with pip python cmake/prepare_macos_runtime.py
          --output build/macos-runtime -L /usr/aarch64-linux-gnu/lib
          --ubuntu-cache build/macos-system-cache
          --native-provider build/native-cuda-typed-interface.json
          --package nvidia-cuda-nvrtc==13.3.33
          --package nvidia-cublas==13.3.0.5
          --package nvidia-cudnn-cu13==9.27.0.42
          --package nvidia-cufft==12.3.0.29
          --package nvidia-curand==10.4.3.29
          --package nvidia-cusolver==12.3.4.7
          --package nvidia-cusparse==12.8.6.72
          --package nvidia-nvjitlink==13.3.33
      - name: Prepare native ABI regression fixture
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -O2 python/tests/fixtures/native_abi.c \
            -Wl,--no-as-needed -lc -o build/native-abi.so
          uv run --project third_party/machso python third_party/machso/compile_bundle.py \
            build/native-abi.so build/macos-runtime/abi-fixture \
            -L /usr/aarch64-linux-gnu/lib --experimental
      - uses: actions/upload-artifact@v7
        with:
          name: lupine-macos-runtime-input
          path: build/macos-runtime
          if-no-files-found: error
          retention-days: 3

  client:
    name: Client / ${{ matrix.tag }}
    needs: macos-runtime-input
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            tag: linux-x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
          - runner: ubuntu-24.04-arm
            tag: linux-aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:bbb43f784ce78a454a9e3351b862a12e7ad5c30972e8aeba092da678918bbba9
          - runner: macos-26
            tag: macosx-arm64
          - runner: macos-26-intel
            tag: macosx-x86_64
          - runner: windows-2025-vs2026
            tag: win-amd64
          - runner: windows-11-vs2026-arm
            tag: win-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Download bootstrapped ARM64 macOS driver
        if: matrix.tag == 'macosx-arm64'
        uses: actions/download-artifact@v8
        with:
          name: lupine-macos-driver-bootstrap

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libnghttp2 ninja

      - name: Stage CUDA headers (macOS)
        if: runner.os == 'macOS' && matrix.tag != 'macosx-arm64'
        run: python3 cmake/fetch_cuda_headers.py cuda-sdk

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $triplet = '${{ matrix.tag }}' -eq 'win-arm64' ? 'arm64-windows-static' : 'x64-windows-static'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            "nghttp2:$triplet" `
            "openssl:$triplet"

      - name: Stage CUDA headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python cmake/fetch_cuda_headers.py cuda-sdk
          # The build reads the toolkit's headers from one flattened tree.
          New-Item -ItemType Directory -Force -Path cuda-sdk/include | Out-Null
          Copy-Item 'cuda-sdk/nvidia/cu13/include/*' cuda-sdk/include -Recurse -Force

      - name: Build client (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            '${{ matrix.manylinux_image }}' \
            bash -lc '
              set -euo pipefail
              dnf -q install -y perl-core
              export PATH="/opt/python/cp312-cp312/bin:$PATH"

              cmake -E remove_directory build
              python3 cmake/fetch_cuda_headers.py cuda-sdk

              NCCL_HOME="$PWD/cuda-sdk/nvidia/nccl" \
              NVSHMEM_HOME="$PWD/cuda-sdk/nvidia/nvshmem" \
              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DLUPINE_BUILD_SERVER=OFF \
                -DLUPINE_BUILD_HIP=OFF \
                -DCMAKE_PREFIX_PATH="$PWD/cuda-sdk/nvidia/cu13"
              cmake --build build --parallel \
                --target lupine_cuda_client lupine_nvml lupine_nccl lupine_nvshmem
            '

      - name: Build client (macOS)
        if: runner.os == 'macOS' && matrix.tag != 'macosx-arm64'
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUPINE_BUILD_SERVER=OFF \
            -DLUPINE_BUILD_HIP=OFF \
            -DCMAKE_PREFIX_PATH="$PWD/cuda-sdk/nvidia/cu13"
          cmake --build build --parallel --target lupine_cuda_client lupine_nvml

      - uses: astral-sh/setup-uv@v5
        if: matrix.tag == 'macosx-arm64'

      - name: Download compiled runtime inputs
        if: matrix.tag == 'macosx-arm64'
        uses: actions/download-artifact@v8
        with:
          name: lupine-macos-runtime-input
          path: build/macos-runtime

      - name: Link converted CUDA runtime
        if: matrix.tag == 'macosx-arm64'
        run: >
          uv run --project third_party/machso python third_party/machso/link_bundle.py
          build/macos-runtime build/libcudart.dylib
          --native-library build/libcuda.dylib

      - name: Sign converted CUDA runtime
        if: matrix.tag == 'macosx-arm64'
        run: >
          uv run --project third_party/machso python third_party/machso/sign_bundle.py
          build/libcudart.dylib

      - name: Verify converted Linux ABI on native macOS
        if: matrix.tag == 'macosx-arm64'
        run: |
          uv run --project third_party/machso python third_party/machso/link_bundle.py \
            build/macos-runtime/abi-fixture build/native-abi.dylib
          uv run --project third_party/machso python third_party/machso/sign_bundle.py \
            build/native-abi.dylib
          clang -dynamiclib -arch arm64 python/tests/fixtures/native_abi.c -o build/host-abi.dylib
          LUPINE_AUTO=0 PYTHONPATH="$PWD/python" \
            LUPINE_TEST_NATIVE_ABI_DYLIB="$PWD/build/native-abi.dylib" \
            LUPINE_TEST_NATIVE_ABI_HOST_DYLIB="$PWD/build/host-abi.dylib" \
            uv run --project third_party/machso --with pytest python -m pytest -q python/tests/test_native_abi.py

      - name: Build client (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.tag }}' -eq 'win-arm64' ? 'ARM64' : 'x64'
          $triplet = '${{ matrix.tag }}' -eq 'win-arm64' ? 'arm64-windows-static' : 'x64-windows-static'
          cmake -S . -B build -G "Visual Studio 18 2026" -A $arch `
            -DLUPINE_BUILD_SERVER=OFF `
            -DLUPINE_BUILD_HIP=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$PWD\cuda-sdk" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$triplet" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          cmake --build build --config Release --target lupine_cuda_client lupine_nvml

      - name: Collect client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client
          case "${{ matrix.tag }}" in
            win-*)
              cp build/Release/nvcuda.dll build/Release/nvml.dll client/
              ;;
            macosx-*)
              cp build/libcuda.dylib build/libnvidia-ml.dylib client/
              if [ "${{ matrix.tag }}" = macosx-arm64 ]; then
                cp build/libcudart.dylib client/
              fi
              ;;
            *)
              # Each shim carries its real counterpart's SONAME, and the NCCL
              # and nvSHMEM majors move independently of the toolkit's, so
              # copy under that name.
              for lib in build/libcuda.so build/libnvidia-ml.so \
                         build/libnccl.so build/libnvshmem_host.so; do
                soname="$(objdump -p "$lib" | awk '/SONAME/ {print $2}')"
                test -n "$soname"
                cp "$(readlink -f "$lib")" "client/$soname"
              done
              ;;
          esac
          ls -1 client

      - uses: actions/upload-artifact@v7
        with:
          name: lupine-client-${{ matrix.tag }}
          path: client
          if-no-files-found: error
          retention-days: 3

  macos-universal:
    name: Client / macosx-universal2
    needs: client
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lupine-client-macosx-*
          path: thin
          merge-multiple: false

      - name: Assemble universal client
        run: |
          set -euo pipefail
          mkdir -p client
          # The converted runtime has only an ARM64 backend. Fuse the shims
          # that have both slices; the ARM64 bundle retains its own runtime.
          for path in thin/lupine-client-macosx-arm64/*.dylib; do
            lib="$(basename "$path")"
            test -f "thin/lupine-client-macosx-x86_64/$lib" || continue
            lipo -create "$path" "thin/lupine-client-macosx-x86_64/$lib" \
                    -output "client/$lib"
          done
          ls -1 client

      - uses: actions/upload-artifact@v7
        with:
          name: lupine-client-macosx-universal2
          path: client
          if-no-files-found: error
          retention-days: 3
