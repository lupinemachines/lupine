name: Native Clients

concurrency:
  group: native-clients-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source revision to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  client:
    name: Complete client / ${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            tag: linux-x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
          - runner: ubuntu-24.04-arm
            tag: linux-aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:bbb43f784ce78a454a9e3351b862a12e7ad5c30972e8aeba092da678918bbba9
          - runner: macos-26
            tag: macosx-arm64
          - runner: macos-26-intel
            tag: macosx-x86_64
          - runner: windows-2025-vs2026
            tag: win-amd64
          - runner: windows-11-vs2026-arm
            tag: win-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libnghttp2 ninja

      - name: Stage CUDA headers (macOS)
        if: runner.os == 'macOS'
        run: python3 cmake/fetch_cuda_headers.py cuda-sdk

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $triplet = '${{ matrix.tag }}' -eq 'win-arm64' ? 'arm64-windows-static' : 'x64-windows-static'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            "nghttp2:$triplet" `
            "openssl:$triplet"

      - name: Stage CUDA headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python cmake/fetch_cuda_headers.py cuda-sdk
          # The build reads the toolkit's headers from one flattened tree;
          # cuDNN keeps its own, reached through CUDNN_PATH.
          New-Item -ItemType Directory -Force -Path cuda-sdk/include | Out-Null
          Copy-Item 'cuda-sdk/nvidia/cu13/include/*' cuda-sdk/include -Recurse -Force

      - name: Build complete client (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            '${{ matrix.manylinux_image }}' \
            bash -lc '
              set -euo pipefail
              dnf -q install -y perl-core
              export PATH="/opt/python/cp312-cp312/bin:$PATH"

              cmake -E remove_directory build
              python3 cmake/fetch_cuda_headers.py cuda-sdk

              CUDNN_PATH="$PWD/cuda-sdk/nvidia/cudnn" \
              NCCL_HOME="$PWD/cuda-sdk/nvidia/nccl" \
              NVSHMEM_HOME="$PWD/cuda-sdk/nvidia/nvshmem" \
              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DLUPINE_BUILD_SERVER=OFF \
                -DLUPINE_BUILD_HIP=OFF \
                -DCMAKE_PREFIX_PATH="$PWD/cuda-sdk/nvidia/cu13"
              cmake --build build --parallel \
                --target lupine_cuda_client lupine_runtime_clients lupine_nvml
            '

      - name: Build complete client (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          CUDNN_PATH="$PWD/cuda-sdk/nvidia/cudnn" \
          NVSHMEM_HOME="$PWD/cuda-sdk/nvidia/nvshmem" \
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUPINE_BUILD_SERVER=OFF \
            -DLUPINE_BUILD_HIP=OFF \
            -DCMAKE_PREFIX_PATH="$PWD/cuda-sdk/nvidia/cu13"
          cmake --build build --parallel --target lupine_cuda_client lupine_runtime_clients lupine_nvml

      - name: Build complete client (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.tag }}' -eq 'win-arm64' ? 'ARM64' : 'x64'
          $triplet = '${{ matrix.tag }}' -eq 'win-arm64' ? 'arm64-windows-static' : 'x64-windows-static'
          $env:CUDNN_PATH = "$PWD\cuda-sdk\nvidia\cudnn"
          $env:NVSHMEM_HOME = "$PWD\cuda-sdk\nvidia\nvshmem"
          cmake -S . -B build -G "Visual Studio 18 2026" -A $arch `
            -DLUPINE_BUILD_SERVER=OFF `
            -DLUPINE_BUILD_HIP=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$PWD\cuda-sdk" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$triplet" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          cmake --build build --config Release --target lupine_cuda_client lupine_runtime_clients lupine_nvml

      - name: Collect complete client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p complete-client
          case "${{ matrix.tag }}" in
            win-*)
              cp build/Release/*.dll complete-client/
              ;;
            macosx-*)
              cp build/lib*.dylib complete-client/
              ;;
            *)
              # Each shim carries its real counterpart's SONAME, and those
              # majors move independently of the toolkit's. Copy every shim
              # under the name consumers dlopen rather than restating them.
              for lib in build/lib*.so; do
                soname="$(objdump -p "$lib" | awk '/SONAME/ {print $2}')"
                test -n "$soname"
                cp "$(readlink -f "$lib")" "complete-client/$soname"
              done
              ;;
          esac
          ls -1 complete-client

      - uses: actions/upload-artifact@v7
        with:
          name: lupine-client-${{ matrix.tag }}
          path: complete-client
          if-no-files-found: error
          retention-days: 3

  macos-universal:
    name: Complete client / macosx-universal2
    needs: client
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lupine-client-macosx-*
          path: thin
          merge-multiple: false

      - name: Assemble universal client
        run: |
          set -euo pipefail
          mkdir -p complete-client
          # Both slices build the same shim set; fuse whatever they carry so a
          # newly added shim needs no change here.
          for path in thin/lupine-client-macosx-arm64/*.dylib; do
            lib="$(basename "$path")"
            lipo -create "$path" "thin/lupine-client-macosx-x86_64/$lib" \
                    -output "complete-client/$lib"
          done
          ls -1 complete-client

      - uses: actions/upload-artifact@v7
        with:
          name: lupine-client-macosx-universal2
          path: complete-client
          if-no-files-found: error
          retention-days: 3
