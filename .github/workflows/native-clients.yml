name: Native Clients

concurrency:
  group: native-clients-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_call:

permissions:
  contents: read

jobs:
  client:
    name: Complete client / ${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            tag: linux-x86_64
          - runner: ubuntu-24.04-arm
            tag: linux-aarch64
          - runner: macos-26
            tag: macosx-arm64
          - runner: macos-26-intel
            tag: macosx-x86_64
          - runner: windows-2025-vs2026
            tag: win-amd64
          - runner: windows-11-vs2026-arm
            tag: win-arm64

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libnghttp2-dev ninja-build

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libnghttp2 ninja

      - name: Download CUDA headers (non-Windows)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          python3 -m pip download \
            --dest headers \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --implementation py \
            --python-version 3 \
            --abi none \
            --no-deps \
            nvidia-cuda-runtime \
            nvidia-nvml-dev
          mkdir -p cuda-sdk
          for wheel in headers/*.whl; do unzip -q "$wheel" -d cuda-sdk; done

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $triplet = '${{ matrix.tag }}' -eq 'win-arm64' ? 'arm64-windows-static' : 'x64-windows-static'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            "nghttp2:$triplet" `
            "openssl:$triplet"

      - name: Download CUDA headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path cuda-wheel, cuda-sdk | Out-Null
          python -m pip download `
            --dest cuda-wheel `
            --only-binary=:all: `
            --platform manylinux2014_x86_64 `
            --implementation py `
            --python-version 3 `
            --abi none `
            --no-deps `
            nvidia-cuda-runtime `
            nvidia-nvml-dev
          $cudaWheel = Get-ChildItem 'cuda-wheel/nvidia_cuda_runtime-*.whl' | Select-Object -First 1
          $nvmlWheel = Get-ChildItem 'cuda-wheel/nvidia_nvml_dev-*.whl' | Select-Object -First 1
          python -m zipfile -e $cudaWheel.FullName cuda-sdk
          python -m zipfile -e $nvmlWheel.FullName cuda-sdk
          $cudaHeader = Get-ChildItem 'cuda-sdk/nvidia' -Recurse -Filter cuda.h | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path cuda-sdk/include | Out-Null
          Copy-Item (Join-Path $cudaHeader.DirectoryName '*') cuda-sdk/include -Recurse -Force

      - name: Build complete client (non-Windows)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUPINE_BUILD_SERVER=OFF \
            -DLUPINE_BUILD_HIP=OFF \
            -DCMAKE_PREFIX_PATH="$PWD/cuda-sdk/nvidia/cu13"
          cmake --build build --parallel --target lupine_cuda_client lupine_nvml
          cmake -S python/cudart -B build-cudart -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUPINE_CUDA_INCLUDE_DIR="$PWD/cuda-sdk/nvidia/cu13/include" \
            -DLUPINE_CLIENT_DIR="$PWD/build"
          cmake --build build-cudart --parallel

      - name: Build complete client (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.tag }}' -eq 'win-arm64' ? 'ARM64' : 'x64'
          $triplet = '${{ matrix.tag }}' -eq 'win-arm64' ? 'arm64-windows-static' : 'x64-windows-static'
          cmake -S . -B build -G "Visual Studio 18 2026" -A $arch `
            -DLUPINE_BUILD_SERVER=OFF `
            -DLUPINE_BUILD_HIP=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$PWD\cuda-sdk" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$triplet" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          cmake --build build --config Release --target lupine_cuda_client lupine_nvml
          cmake -S python/cudart -B build-cudart -G "Visual Studio 18 2026" -A $arch `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" `
            "-DLUPINE_CUDA_INCLUDE_DIR=$PWD\cuda-sdk\include" `
            "-DLUPINE_CLIENT_DIR=$PWD\build\Release"
          cmake --build build-cudart --config Release

      - name: Collect complete client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p complete-client
          case "${{ matrix.tag }}" in
            win-*)
              cp build/Release/nvcuda.dll build-cudart/Release/cudart64_13.dll \
                build/Release/nvml.dll complete-client/
              ;;
            macosx-*)
              cp build/libcuda.dylib build-cudart/libcudart.dylib \
                build/libnvidia-ml.dylib complete-client/
              ;;
            *)
              cp build/libcuda.so.1 build-cudart/libcudart.so.13 \
                build/libnvidia-ml.so.1 complete-client/
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: lupine-client-${{ matrix.tag }}
          path: complete-client
          if-no-files-found: error
          retention-days: 3

  macos-universal:
    name: Complete client / macosx-universal2
    needs: client
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lupine-client-macosx-*
          path: thin
          merge-multiple: false

      - name: Assemble universal client
        run: |
          set -euo pipefail
          mkdir -p complete-client
          for lib in libcuda.dylib libcudart.dylib libnvidia-ml.dylib; do
            lipo -create "thin/lupine-client-macosx-arm64/$lib" \
                    "thin/lupine-client-macosx-x86_64/$lib" \
                    -output "complete-client/$lib"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: lupine-client-macosx-universal2
          path: complete-client
          if-no-files-found: error
          retention-days: 3
