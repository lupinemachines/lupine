name: Codegen Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codegen:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.3.1"
          method: network
          sub-packages: '["nvcc"]'

      - name: Install HIP SDK
        run: |
          wget -q https://repo.radeon.com/amdgpu-install/7.2.4/ubuntu/noble/amdgpu-install_7.2.4.70204-1_all.deb
          sudo apt-get install -y ./amdgpu-install_7.2.4.70204-1_all.deb
          sudo apt-get update
          sudo apt-get install -y rocm-hip-runtime-dev

      - name: Regenerate checked-in sources
        run: |
          sudo ln -sfn "$CUDA_PATH" /usr/local/cuda
          uv run codegen/codegen.py

      - name: Verify generated files are current
        run: git diff --exit-code -- codegen
