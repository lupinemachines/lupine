name: Build CUDA Matrix

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  pull_request:
  push:
    branches:
      - main
      - cuda-11-builder-support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-clients:
    name: Build all native client variants
    uses: ./.github/workflows/native-clients.yml

  build:
    name: ${{ matrix.component }} CUDA ${{ matrix.cuda }} / Ubuntu ${{ matrix.ubuntu }}
    needs: native-clients
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: client
            cuda: 13.3.1
            ubuntu: "24.04"
          - component: server
            cuda: 13.3.1
            ubuntu: "24.04"
          - component: client
            cuda: 12.9.1
            ubuntu: "24.04"
          - component: server
            cuda: 12.9.1
            ubuntu: "24.04"
          - component: client
            cuda: 11.8.0
            ubuntu: "22.04"
          - component: server
            cuda: 11.8.0
            ubuntu: "22.04"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download all native client variants
        if: matrix.component == 'server'
        uses: actions/download-artifact@v8
        with:
          pattern: lupine-client-*
          path: client-libs
          merge-multiple: false

      - name: Build ${{ matrix.component }}
        run: |
          set -euo pipefail
          bundle_args=()
          if [ "${{ matrix.component }}" = server ]; then
            bundle_args+=(
              --build-arg LUPINE_CLIENT_BUNDLE_INPUT=/opt/lupine/client-libs
            )
          fi
          docker build \
            -f Dockerfile \
            --target "${{ matrix.component }}" \
            --build-arg CUDA_VERSION="${{ matrix.cuda }}" \
            --build-arg UBUNTU_VERSION="${{ matrix.ubuntu }}" \
            "${bundle_args[@]}" \
            -t "lupine-${{ matrix.component }}:cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}" \
            .

      - name: Verify build artifacts
        run: |
          image="lupine-${{ matrix.component }}:cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}"
          if [ "${{ matrix.component }}" = "client" ]; then
            docker run --rm --entrypoint bash "$image" -lc '
              set -euo pipefail
              test -e /opt/lupine/lib/libcuda.so.1
              test -e /opt/lupine/lib/libcudart.so
              test -e /opt/lupine/lib/libcublas.so
              test -e /opt/lupine/lib/libcublasLt.so
              test -e /opt/lupine/lib/libcufft.so
              test -e /opt/lupine/lib/libcudnn.so
              test -e /opt/lupine/lib/libcurand.so
              test -e /opt/lupine/lib/libcusparse.so
              test -e /opt/lupine/lib/libcusparseLt.so.0
              test -e /opt/lupine/lib/libcusolver.so
              test -e /opt/lupine/lib/libcusolverMg.so
              test -e /opt/lupine/lib/libnvrtc.so
              test -e /opt/lupine/lib/libnccl.so.2
              case "${{ matrix.cuda }}" in 11.*) ;; *) test -e /opt/lupine/lib/libnvJitLink.so ;; esac
              test -e /opt/lupine/lib/libnvjpeg.so
              test -e /opt/lupine/lib/libnppc.so
              test -e /opt/lupine/lib/libnppig.so
              test -e /opt/lupine/lib/libcufile.so.0
              # The CUPTI SONAME is the toolkit major, and carries the minor
              # before CUDA 12.
              cupti_soversion="$(echo "${{ matrix.cuda }}" | cut -d. -f1)"
              case "${{ matrix.cuda }}" in 11.*) cupti_soversion=11.8 ;; esac
              test -e "/opt/lupine/lib/libcupti.so.$cupti_soversion"
              case "${{ matrix.cuda }}" in 11.*) ;; *) test -e /opt/lupine/lib/libnvshmem_host.so.3 ;; esac
              test -e /opt/lupine/lib/libnvidia-ml.so.1
              test -e /opt/lupine/lib/libamdhip64.so.1
              test -x /usr/bin/nvidia-smi
              test "${LD_LIBRARY_PATH%%:*}" = /opt/lupine/lib
              test ! -d /usr/local/cuda
              test ! -d /opt/rocm
            '
          else
            docker run --rm --entrypoint bash "$image" -lc '
              set -euo pipefail
              test -x /opt/lupine/bin/lupine_driver_server
              test ! -e /opt/lupine/client-bundles
              test -e /usr/local/cuda/compat/libcuda.so.1
              test -e /opt/rocm/lib/libamdhip64.so
              ! ldd /opt/lupine/bin/lupine_driver_server | grep -q "not found"
            '
          fi

      - name: Collect client artifacts
        if: matrix.component == 'client'
        run: |
          set -euo pipefail
          image="lupine-client:cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}"
          out="artifacts/lupine-client-cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}-x86_64"
          archive="${out}.zip"
          mkdir -p "$out"

          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker cp "$container:/opt/lupine/lib/libcuda.so.1" "$out/libcuda.so.1"
          cuda_major="${{ matrix.cuda }}"
          cuda_major="${cuda_major%%.*}"
          runtime_soname="libcudart.so.${cuda_major}"
          if [[ "$cuda_major" == 11 ]]; then
            runtime_soname="libcudart.so.11.0"
          fi
          docker cp "$container:/opt/lupine/lib/$runtime_soname" "$out/$runtime_soname"
          docker cp "$container:/opt/lupine/lib/libcublas.so.${cuda_major}" "$out/libcublas.so.${cuda_major}"
          docker cp "$container:/opt/lupine/lib/libcublasLt.so.${cuda_major}" "$out/libcublasLt.so.${cuda_major}"
          # cuFFT's major is its own, not the toolkit's.
          cufft_lib="$(docker run --rm --entrypoint sh "$image" -c 'ls /opt/lupine/lib/libcufft.so.[0-9]*')"
          docker cp "$container:$cufft_lib" "$out/$(basename "$cufft_lib")"
          # So is cuDNN's.
          cudnn_lib="$(docker run --rm --entrypoint sh "$image" -c 'ls /opt/lupine/lib/libcudnn.so.[0-9]*')"
          docker cp "$container:$cudnn_lib" "$out/$(basename "$cudnn_lib")"
          # So is cuRAND's.
          curand_lib="$(docker run --rm --entrypoint sh "$image" -c 'ls /opt/lupine/lib/libcurand.so.[0-9]*')"
          docker cp "$container:$curand_lib" "$out/$(basename "$curand_lib")"
          # So is cuSPARSE's.
          cusparse_lib="$(docker run --rm --entrypoint sh "$image" -c 'ls /opt/lupine/lib/libcusparse.so.[0-9]*')"
          docker cp "$container:$cusparse_lib" "$out/$(basename "$cusparse_lib")"
          # cuSPARSELt's SONAME major is 0 for every release of the library.
          docker cp "$container:/opt/lupine/lib/libcusparseLt.so.0" "$out/libcusparseLt.so.0"
          # So is cuSOLVER's, which cuSOLVERMg shares.
          cusolver_lib="$(docker run --rm --entrypoint sh "$image" -c 'ls /opt/lupine/lib/libcusolver.so.[0-9]*')"
          docker cp "$container:$cusolver_lib" "$out/$(basename "$cusolver_lib")"
          cusolvermg_lib="$(docker run --rm --entrypoint sh "$image" -c 'ls /opt/lupine/lib/libcusolverMg.so.[0-9]*')"
          docker cp "$container:$cusolvermg_lib" "$out/$(basename "$cusolvermg_lib")"
          # NVRTC 11.x kept the 11.2 soname.
          nvrtc_lib="$(docker run --rm --entrypoint sh "$image" -c 'ls /opt/lupine/lib/libnvrtc.so.[0-9]*')"
          docker cp "$container:$nvrtc_lib" "$out/$(basename "$nvrtc_lib")"
          docker cp "$container:/opt/lupine/lib/libnccl.so.2" "$out/libnccl.so.2"
          # nvJitLink starts at CUDA 12 and shares the toolkit's major.
          nvjitlink_libs=()
          if [[ "$cuda_major" != 11 ]]; then
            docker cp "$container:/opt/lupine/lib/libnvJitLink.so.${cuda_major}" "$out/libnvJitLink.so.${cuda_major}"
            cp "$out/libnvJitLink.so.${cuda_major}" "$out/libnvJitLink.so"
            nvjitlink_libs=(libnvJitLink.so "libnvJitLink.so.${cuda_major}")
          fi
          nvjpeg_lib="$(docker run --rm --entrypoint sh "$image" -c 'ls /opt/lupine/lib/libnvjpeg.so.[0-9]*')"
          docker cp "$container:$nvjpeg_lib" "$out/$(basename "$nvjpeg_lib")"
          cp "$out/$(basename "$nvjpeg_lib")" "$out/libnvjpeg.so"
          # NPP's major is its own too, and every NPP library shares it.
          npp_files=()
          for npp in nppc nppial nppicc nppidei nppif nppig nppim nppist nppisu nppitc npps; do
            npp_lib="$(docker run --rm --entrypoint sh "$image" -c "ls /opt/lupine/lib/lib${npp}.so.[0-9]*")"
            docker cp "$container:$npp_lib" "$out/$(basename "$npp_lib")"
            cp "$out/$(basename "$npp_lib")" "$out/lib${npp}.so"
            npp_files+=("lib${npp}.so" "$(basename "$npp_lib")")
          done
          # cuFile's SONAME major is 0 for every release of the library.
          docker cp "$container:/opt/lupine/lib/libcufile.so.0" "$out/libcufile.so.0"
          # CUPTI's SONAME is the toolkit's major, and carries the minor before
          # CUDA 12 (libcupti.so.11.8).
          cupti_lib="$(docker run --rm --entrypoint sh "$image" -c 'ls /opt/lupine/lib/libcupti.so.[0-9]*')"
          docker cp "$container:$cupti_lib" "$out/$(basename "$cupti_lib")"
          # nvSHMEM's package for CUDA 11 predates the host-only header the
          # shim builds from, so the shim starts at CUDA 12.
          nvshmem_libs=()
          if [[ "$cuda_major" != 11 ]]; then
            nvshmem_lib="$(docker run --rm --entrypoint sh "$image" -c 'ls /opt/lupine/lib/libnvshmem_host.so.[0-9]*')"
            docker cp "$container:$nvshmem_lib" "$out/$(basename "$nvshmem_lib")"
            cp "$out/$(basename "$nvshmem_lib")" "$out/libnvshmem_host.so"
            nvshmem_libs=(libnvshmem_host.so "$(basename "$nvshmem_lib")")
          fi
          docker cp "$container:/opt/lupine/lib/libnvidia-ml.so.1" "$out/libnvidia-ml.so.1"
          docker cp "$container:/opt/lupine/lib/libamdhip64.so.1" "$out/libamdhip64.so.1"
          cp "$out/libcuda.so.1" "$out/libcuda.so"
          cp "$out/$runtime_soname" "$out/libcudart.so"
          cp "$out/libcublas.so.${cuda_major}" "$out/libcublas.so"
          cp "$out/libcublasLt.so.${cuda_major}" "$out/libcublasLt.so"
          cp "$out/$(basename "$cufft_lib")" "$out/libcufft.so"
          cp "$out/$(basename "$cudnn_lib")" "$out/libcudnn.so"
          cp "$out/$(basename "$curand_lib")" "$out/libcurand.so"
          cp "$out/$(basename "$cusparse_lib")" "$out/libcusparse.so"
          cp "$out/libcusparseLt.so.0" "$out/libcusparseLt.so"
          cp "$out/$(basename "$cusolver_lib")" "$out/libcusolver.so"
          cp "$out/$(basename "$cusolvermg_lib")" "$out/libcusolverMg.so"
          cp "$out/$(basename "$nvrtc_lib")" "$out/libnvrtc.so"
          cp "$out/libnccl.so.2" "$out/libnccl.so"
          cp "$out/libcufile.so.0" "$out/libcufile.so"
          cp "$out/$(basename "$cupti_lib")" "$out/libcupti.so"
          cp "$out/libnvidia-ml.so.1" "$out/libnvidia-ml.so"
          cp "$out/libamdhip64.so.1" "$out/libamdhip64.so"
          (cd "$out" && sha256sum libcuda.so libcuda.so.1 libcudart.so "$runtime_soname" libcublas.so "libcublas.so.${cuda_major}" libcublasLt.so "libcublasLt.so.${cuda_major}" libcufft.so "$(basename "$cufft_lib")" libcudnn.so "$(basename "$cudnn_lib")" libcurand.so "$(basename "$curand_lib")" libcusparse.so "$(basename "$cusparse_lib")" libcusparseLt.so libcusparseLt.so.0 libcusolver.so "$(basename "$cusolver_lib")" libcusolverMg.so "$(basename "$cusolvermg_lib")" libnvrtc.so "$(basename "$nvrtc_lib")" libnccl.so libnccl.so.2 "${nvjitlink_libs[@]}" libnvjpeg.so "$(basename "$nvjpeg_lib")" "${npp_files[@]}" libcufile.so libcufile.so.0 libcupti.so "$(basename "$cupti_lib")" "${nvshmem_libs[@]}" libnvidia-ml.so libnvidia-ml.so.1 libamdhip64.so libamdhip64.so.1 > SHA256SUMS)
          (cd "$out" && zip -r "../$(basename "$archive")" .)

      - name: Collect server artifacts
        if: matrix.component == 'server'
        run: |
          set -euo pipefail
          image="lupine-server:cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}"
          out="artifacts/lupine-server-cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}-x86_64"
          archive="${out}.zip"
          mkdir -p "$out"

          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker cp "$container:/opt/lupine/bin/lupine_driver_server" "$out/lupine_driver_server"
          chmod +x "$out/lupine_driver_server"
          (cd "$out" && sha256sum lupine_driver_server > SHA256SUMS)
          (cd "$out" && zip -r "../$(basename "$archive")" .)

      - name: Upload client artifacts
        if: matrix.component == 'client'
        uses: actions/upload-artifact@v7
        with:
          name: lupine-client-cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}-x86_64
          path: artifacts/lupine-client-cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}-x86_64.zip
          if-no-files-found: error

      - name: Upload server artifacts
        if: matrix.component == 'server'
        uses: actions/upload-artifact@v7
        with:
          name: lupine-server-cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}-x86_64
          path: artifacts/lupine-server-cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}-x86_64.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="artifacts/lupine-${{ matrix.component }}-cuda-${{ matrix.cuda }}-ubuntu${{ matrix.ubuntu }}-x86_64.zip"
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "$asset" \
            --repo "${{ github.repository }}" \
            --clobber
