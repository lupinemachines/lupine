name: Python

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native shims / ${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            tag: linux-x86_64
          - runner: ubuntu-24.04-arm
            tag: linux-aarch64
          - runner: macos-26
            tag: macosx-arm64
          - runner: macos-26-intel
            tag: macosx-x86_64
          - runner: windows-2025-vs2026
            tag: win-amd64
          - runner: windows-11-vs2026-arm
            tag: win-arm64

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libnghttp2-dev ninja-build

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libnghttp2 ninja

      - name: Download CUDA headers (non-Windows)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          python3 -m pip download \
            --dest headers \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --implementation py \
            --python-version 3 \
            --abi none \
            --no-deps \
            nvidia-cuda-runtime \
            nvidia-nvml-dev
          mkdir -p cuda-sdk
          for wheel in headers/*.whl; do unzip -q "$wheel" -d cuda-sdk; done


      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe")) {
            throw 'The runner vcpkg installation was not found'
          }
          $triplet = '${{ matrix.tag }}' -eq 'win-arm64' ? 'arm64-windows-static' : 'x64-windows-static'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            "nghttp2:$triplet" `
            "openssl:$triplet"

      - name: Download CUDA headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path cuda-wheel, cuda-sdk | Out-Null
          python -m pip download `
            --dest cuda-wheel `
            --only-binary=:all: `
            --platform manylinux2014_x86_64 `
            --implementation py `
            --python-version 3 `
            --abi none `
            --no-deps `
            nvidia-cuda-runtime `
            nvidia-nvml-dev
          $cudaWheel = Get-ChildItem 'cuda-wheel/nvidia_cuda_runtime-*.whl' | Select-Object -First 1
          $nvmlWheel = Get-ChildItem 'cuda-wheel/nvidia_nvml_dev-*.whl' | Select-Object -First 1
          if ($null -eq $cudaWheel -or $null -eq $nvmlWheel) {
            throw 'CUDA or NVML header wheel was not downloaded'
          }
          python -m zipfile -e $cudaWheel.FullName cuda-sdk
          python -m zipfile -e $nvmlWheel.FullName cuda-sdk
          $cudaHeader = Get-ChildItem 'cuda-sdk/nvidia' -Recurse -Filter cuda.h | Select-Object -First 1
          if ($null -eq $cudaHeader) {
            throw 'CUDA headers were not found in the downloaded wheels'
          }
          New-Item -ItemType Directory -Force -Path cuda-sdk/include | Out-Null
          Copy-Item (Join-Path $cudaHeader.DirectoryName '*') cuda-sdk/include -Recurse -Force

      - name: Configure and build (non-Windows)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUPINE_BUILD_SERVER=OFF \
            -DCMAKE_PREFIX_PATH="$PWD/cuda-sdk/nvidia/cu13"
          cmake --build build --parallel --target lupine_cuda_client lupine_nvml
          # The runtime translation layer is Python-package-specific and
          # builds standalone against the just-built clients.
          cmake -S python/cudart -B build-cudart -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUPINE_CUDA_INCLUDE_DIR="$PWD/cuda-sdk/nvidia/cu13/include" \
            -DLUPINE_CLIENT_DIR="$PWD/build"
          cmake --build build-cudart --parallel

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.tag }}' -eq 'win-arm64' ? 'ARM64' : 'x64'
          $triplet = '${{ matrix.tag }}' -eq 'win-arm64' ? 'arm64-windows-static' : 'x64-windows-static'
          cmake -S . -B build -G "Visual Studio 18 2026" -A $arch `
            -DLUPINE_BUILD_SERVER=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$PWD\cuda-sdk" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$triplet" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          cmake --build build --config Release --target lupine_cuda_client lupine_nvml
          cmake -S python/cudart -B build-cudart -G "Visual Studio 18 2026" -A $arch `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" `
            "-DLUPINE_CUDA_INCLUDE_DIR=$PWD\cuda-sdk\include" `
            "-DLUPINE_CLIENT_DIR=$PWD\build\Release"
          cmake --build build-cudart --config Release

      - name: Stage shims
        if: matrix.tag != 'macosx-arm64' && matrix.tag != 'macosx-x86_64'
        run: |
          set -euo pipefail
          if [[ "${{ matrix.tag }}" == win-* ]]; then
            ./python/build.py stage "${{ matrix.tag }}" build/Release build-cudart/Release
          else
            ./python/build.py stage "${{ matrix.tag }}" build build-cudart
          fi
        shell: bash

      - name: Stage thin macOS dylibs
        if: matrix.tag == 'macosx-arm64' || matrix.tag == 'macosx-x86_64'
        run: |
          set -euo pipefail
          mkdir -p python/lupine/_libs/${{ matrix.tag }}
          cp build/libcuda.dylib build/libnvidia-ml.dylib \
            python/lupine/_libs/${{ matrix.tag }}/
          cp build-cudart/libcudart.dylib python/lupine/_libs/${{ matrix.tag }}/
        shell: bash

      - name: Upload staged shims
        uses: actions/upload-artifact@v7
        with:
          name: lupine-native-${{ matrix.tag }}
          path: python/lupine/_libs/${{ matrix.tag }}
          if-no-files-found: error
          retention-days: 3

  macos-universal:
    name: Assemble macOS universal2 slices
    needs: native
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Download thin dylibs
        uses: actions/download-artifact@v8
        with:
          pattern: lupine-native-macosx-*
          path: thin
          merge-multiple: false

      - name: lipo universal dylibs
        run: |
          set -euo pipefail
          mkdir -p universal
          for lib in libcuda.dylib libcudart.dylib libnvidia-ml.dylib; do
            lipo -create "thin/lupine-native-macosx-arm64/$lib" \
                    "thin/lupine-native-macosx-x86_64/$lib" \
                    -output "universal/$lib"
          done

      - name: Stage universal shims
        run: ./python/build.py stage macosx-universal2 universal

      - name: Upload universal shims
        uses: actions/upload-artifact@v7
        with:
          name: lupine-native-macosx-universal2
          path: python/lupine/_libs/macosx-universal2
          if-no-files-found: error
          retention-days: 3

  package:
    name: Assemble and test wheel
    needs: [native, macos-universal]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Download all native shims
        uses: actions/download-artifact@v8
        with:
          pattern: lupine-native-*
          path: native
          merge-multiple: false

      - name: Stage shims into the package
        run: |
          set -euo pipefail
          for dir in native/lupine-native-*; do
            tag="${dir##*/lupine-native-}"
            # Thin macOS slices only feed the lipo job.
            case "$tag" in macosx-arm64|macosx-x86_64) continue ;; esac
            ./python/build.py stage "$tag" "$dir"
          done

      - name: Run Python tests
        working-directory: python
        run: uv run --all-extras pytest

      - name: Check PyTorch ABI against bundled shims
        working-directory: python
        run: |
          uv run --all-extras python - <<'PY'
          import lupine

          # Loading and importing only exercises dynamic linking and does not
          # require a CUDA device or a running LUPINE server.
          lupine.load_native(missing_ok=False)
          import torch

          print(f"torch={torch.__version__} cuda={torch.version.cuda}")
          PY

      - name: Test minimum supported Python
        working-directory: python
        run: uv run --python 3.10 --all-extras pytest

      - name: Build Python package
        working-directory: python
        run: uv build --wheel

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lupine-python-package
          path: python/dist/*
