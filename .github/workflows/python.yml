name: Python

concurrency:
  # A reusable invocation inherits github.workflow from its caller. Namespace
  # this group so it cannot cancel the caller that is waiting on it.
  group: python-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source revision to build
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clients:
    name: Build native clients
    uses: ./.github/workflows/native-clients.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}

  package:
    name: Assemble and test wheels
    needs: clients
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Unit tests exercise the hook explicitly. Do not activate it for the
      # test runner itself.
      LUPINE_AUTO: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Download native clients
        uses: actions/download-artifact@v8
        with:
          pattern: lupine-client-*
          path: clients
          merge-multiple: false

      - name: Stage runtime stubs
        run: |
          set -euo pipefail
          mkdir -p python/lupine/_libs
          for dir in clients/lupine-client-*; do
            tag="${dir##*/lupine-client-}"
            # Thin macOS slices only feed the lipo job.
            case "$tag" in macosx-arm64|macosx-x86_64) continue ;; esac
            case "$tag" in
              linux-*) runtime=libcudart.so.13 ;;
              macosx-*) runtime=libcudart.dylib ;;
              win-*) runtime=cudart64_13.dll ;;
              *) echo "unknown client platform: $tag" >&2; exit 1 ;;
            esac
            mkdir -p "python/lupine/_libs/$tag"
            cp "$dir/$runtime" "python/lupine/_libs/$tag/"
          done

      - name: Run Python tests
        working-directory: python
        run: |
          python verify_release.py
          uv run --all-extras pytest

      - name: Test minimum supported Python
        working-directory: python
        run: uv run --python 3.10 --all-extras pytest

      - name: Build Python packages
        working-directory: python
        run: |
          uv build --wheel --out-dir dist/lupine
          uv build --wheel auto --out-dir dist/lupine-auto
          python verify_release.py --dist dist

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lupine-python-package
          path: python/dist
