name: C++ Unit Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: CMake _test targets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build test environment
        run: |
          docker build \
            -f Dockerfile \
            --target builder \
            --build-arg CUDA_VERSION="13.3.1" \
            --build-arg UBUNTU_VERSION="24.04" \
            -t lupine-unit-tests \
            .

      - name: Build and run CMake _test targets
        run: |
          docker run --rm --entrypoint bash lupine-unit-tests -lc \
            'BUILD_DIR=/opt/lupine/build /opt/lupine/test/run_unit_tests.sh'
