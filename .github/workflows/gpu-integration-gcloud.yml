name: GPU Integration on GCE

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Google Cloud project, Workload Identity Provider, and service account
# identifiers are intentionally committed here. They are public resource names,
# not credentials, and fork pull_request workflows cannot read repository
# variables. Google still issues short-lived credentials only when the provider's
# repository, workflow, event, and actor conditions match.
# The dedicated integration binary cache is:
#   gs://kevmo314-lupine-gpu-integration-cache
#
# Keep GCP_SERVICE_ACCOUNT on a custom role rather than project Owner/Editor.
# Bind it through a Workload Identity Provider condition restricted to this
# repository's numeric GitHub IDs, this workflow path, trusted events/refs, and
# maintainer actors.
# The service account has bucket-scoped Storage Admin access to the dedicated
# cache bucket, and this workflow owns that bucket's lifecycle configuration.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  provision:
    name: Provision shared ${{ matrix.name }} L4 VM
    runs-on: ubuntu-latest
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            name: Linux
            image_project: ml-images
            image_family: common-cu129-ubuntu-2404-nvidia-580
          - os: windows
            name: Windows
            image_project: windows-cloud
            image_family: windows-2022

    env:
      GCP_PROJECT_ID: kevmo314
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/272419586516/locations/global/workloadIdentityPools/lupine-github/providers/github
      GCP_SERVICE_ACCOUNT: lupine-gpu-ci@kevmo314.iam.gserviceaccount.com
      GCP_ZONE: us-central1-a
      GCP_FALLBACK_ZONES: >-
        us-central1-c us-central1-b
        us-west1-a us-west1-b us-west1-c
        us-east1-b us-east1-c us-east1-d
        us-east4-a us-east4-c
        us-west4-a us-west4-c
        northamerica-northeast1-b northamerica-northeast1-c
        northamerica-northeast2-a northamerica-northeast2-b
        europe-west1-b europe-west1-c
      GCP_NETWORK: default
      MACHINE_TYPE: g2-standard-8
      VM_MAX_RUN_DURATION: 350m
      VM_NAME: lupine-gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
      VM_TAG: lupine-gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
      FIREWALL_DENY_RULE: lupine-gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-deny
      BOOTSTRAP_FIREWALL_RULE: lupine-gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-bootstrap

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Prepare shared SSH key and runner allowlist
        run: |
          set -euo pipefail
          mkdir -p ssh
          ssh-keygen -t ed25519 -N '' \
            -C "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.os }}" \
            -f ssh/id_ed25519
          chmod 700 ssh
          chmod 600 ssh/id_ed25519
          runner_ip="$(curl -fsS https://api.ipify.org)"
          test -n "$runner_ip"
          echo "RUNNER_IP=$runner_ip" >> "$GITHUB_ENV"

      - name: Create bootstrap firewall rules
        run: |
          set -euo pipefail
          gcloud compute firewall-rules create "$BOOTSTRAP_FIREWALL_RULE" \
            --project="$GCP_PROJECT_ID" \
            --network="$GCP_NETWORK" \
            --direction=INGRESS \
            --priority=800 \
            --action=ALLOW \
            --rules=tcp:22 \
            --source-ranges="$RUNNER_IP/32" \
            --target-tags="$VM_TAG"
          gcloud compute firewall-rules create "$FIREWALL_DENY_RULE" \
            --project="$GCP_PROJECT_ID" \
            --network="$GCP_NETWORK" \
            --direction=INGRESS \
            --priority=900 \
            --action=DENY \
            --rules=tcp:1-65535,udp:1-65535,icmp,esp,ah,sctp \
            --source-ranges=0.0.0.0/0 \
            --target-tags="$VM_TAG"

      - name: Write VM startup script
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == linux ]]; then
            cat > "$RUNNER_TEMP/startup.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl docker.io libnghttp2-14
          curl -fsSL \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-compat-13-3_610.57.04-1ubuntu1_amd64.deb \
            -o /tmp/cuda-compat.deb
          echo '5150dbbe6376c29a53ec01730aa1b335f192d5965e95be71a448a719f10044a4  /tmp/cuda-compat.deb' \
            | sha256sum -c -
          dpkg -i /tmp/cuda-compat.deb
          rm -f /tmp/cuda-compat.deb
          rm -rf /var/lib/apt/lists/*
          usermod -aG docker gha
          touch /var/lib/lupine-startup-complete
          SCRIPT
          else
            cat > "$RUNNER_TEMP/startup.ps1" <<'SCRIPT'
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy Bypass -Scope LocalMachine -Force
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
            Invoke-Expression ((New-Object Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          choco install -y --no-progress git cmake ninja powershell-core python312 visualstudio2022buildtools visualstudio2022-workload-vctools
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Chocolatey exited with $LASTEXITCODE" }
          $env:Path = "C:\Program Files\Git\cmd;C:\Program Files\CMake\bin;C:\ProgramData\chocolatey\bin;$env:Path"
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
            if ($LASTEXITCODE -ne 0) { throw "git clone vcpkg exited with $LASTEXITCODE" }
            & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap exited with $LASTEXITCODE" }
          }
          & C:\vcpkg\vcpkg.exe install nghttp2:x64-windows-static openssl:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install exited with $LASTEXITCODE" }
          $toolkits = @(
            @{ Version = '13.3.1'; Short = '13.3' },
            @{ Version = '12.4.1'; Short = '12.4' },
            @{ Version = '11.8.0'; Short = '11.8' }
          )
          foreach ($toolkit in $toolkits) {
            $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$($toolkit.Short)"
            if (Test-Path "$root\bin\nvcc.exe") { continue }
            $installer = "C:\cuda-$($toolkit.Version)-network.exe"
            $url = "https://developer.download.nvidia.com/compute/cuda/$($toolkit.Version)/network_installers/cuda_$($toolkit.Version)_windows_network.exe"
            Invoke-WebRequest $url -OutFile $installer
            $suffix = $toolkit.Short
            $components = @(
              "nvcc_$suffix", "cudart_$suffix", "cudart_dev_$suffix",
              "cublas_$suffix", "cublas_dev_$suffix", "cufft_$suffix", "cufft_dev_$suffix",
              "curand_$suffix", "curand_dev_$suffix", "cusolver_$suffix", "cusolver_dev_$suffix",
              "cusparse_$suffix", "cusparse_dev_$suffix", "npp_$suffix", "npp_dev_$suffix",
              "nvjpeg_$suffix", "nvjpeg_dev_$suffix", "nvrtc_$suffix", "nvrtc_dev_$suffix",
              "nvml_dev_$suffix", "visual_studio_integration_$suffix"
            )
            if ($toolkit.Short -eq '13.3') {
              $components += "crt_$suffix", "nvvm_$suffix"
            }
            $process = Start-Process $installer -ArgumentList (@('-s') + $components) -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010) -or -not (Test-Path "$root\bin\nvcc.exe")) {
              throw "CUDA $($toolkit.Version) installation failed with exit code $($process.ExitCode)"
            }
            Remove-Item $installer -Force
          }
          New-Item -ItemType File -Force C:\lupine-startup-complete | Out-Null
          SCRIPT
          fi

      - name: Create shared L4 VM
        run: |
          set -euo pipefail
          # shellcheck disable=SC2206
          fallback_zones=($GCP_FALLBACK_ZONES)
          candidate_zones=("$GCP_ZONE" "${fallback_zones[@]}")
          selected_zone=""
          vm_ip=""
          for zone in "${candidate_zones[@]}"; do
            instance_metadata="block-project-ssh-keys=TRUE,enable-oslogin=FALSE,ssh-keys=gha:$(cat ssh/id_ed25519.pub)"
            if [[ "${{ matrix.os }}" == windows ]]; then
              instance_metadata+=",enable-windows-ssh=TRUE,sysprep-specialize-script-cmd=googet -noconfirm=true install google-compute-engine-ssh,sysprep-specialize-script-url=https://github.com/GoogleCloudPlatform/compute-gpu-installation/raw/main/windows/install_gpu_driver.ps1"
            fi
            create_args=(
              "$VM_NAME"
              "--project=$GCP_PROJECT_ID"
              "--zone=$zone"
              "--machine-type=$MACHINE_TYPE"
              "--network=$GCP_NETWORK"
              "--tags=$VM_TAG"
              "--image-family=${{ matrix.image_family }}"
              "--image-project=${{ matrix.image_project }}"
              "--boot-disk-size=250GB"
              "--boot-disk-type=pd-balanced"
              "--maintenance-policy=TERMINATE"
              "--max-run-duration=$VM_MAX_RUN_DURATION"
              "--instance-termination-action=DELETE"
              "--no-service-account"
              "--no-scopes"
              "--metadata=$instance_metadata"
              "--shielded-vtpm"
              "--shielded-integrity-monitoring"
              "--no-shielded-secure-boot"
            )
            if [[ "${{ matrix.os }}" == linux ]]; then
              create_args+=("--metadata-from-file=startup-script=$RUNNER_TEMP/startup.sh")
            else
              create_args+=(
                "--metadata-from-file=windows-startup-script-ps1=$RUNNER_TEMP/startup.ps1"
              )
            fi
            if vm_ip="$(gcloud compute instances create "${create_args[@]}" \
              --format='value(networkInterfaces[0].accessConfigs[0].natIP)')"; then
              selected_zone="$zone"
              break
            fi
            gcloud compute instances delete "$VM_NAME" \
              --project="$GCP_PROJECT_ID" --zone="$zone" --quiet >/dev/null 2>&1 || true
          done
          test -n "$selected_zone"
          test -n "$vm_ip"
          {
            echo "GCP_ZONE=$selected_zone"
            echo "VM_IP=$vm_ip"
          } >> "$GITHUB_ENV"

      - name: Wait for shared VM
        run: |
          set -euo pipefail
          ssh_base=(
            ssh -i ssh/id_ed25519 -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=ssh/known_hosts
            -o ConnectTimeout=10 "gha@$VM_IP"
          )
          ready=false
          for _ in $(seq 1 720); do
            if [[ "${{ matrix.os }}" == linux ]]; then
              probe='test -f /var/lib/lupine-startup-complete && sudo docker info >/dev/null && nvidia-smi -L'
            else
              probe='powershell.exe -NoProfile -NonInteractive -Command "if (-not (Test-Path C:\lupine-startup-complete)) { exit 1 }; nvidia-smi -L"'
            fi
            if "${ssh_base[@]}" "$probe"; then
              ready=true
              break
            fi
            sleep 10
          done
          if [[ "$ready" != true ]]; then
            echo "${{ matrix.name }} VM did not finish provisioning before the timeout" >&2
            exit 1
          fi

      - name: Remove bootstrap firewall rule
        if: always()
        run: >-
          gcloud compute firewall-rules delete "$BOOTSTRAP_FIREWALL_RULE"
          --project="$GCP_PROJECT_ID" --quiet || true

      - name: Upload shared SSH credentials
        uses: actions/upload-artifact@v7
        with:
          name: gpu-integration-ssh-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ssh/
          if-no-files-found: error
          retention-days: 1

  gpu-integration:
    name: ${{ matrix.name }} ${{ matrix.os_name }} GPU integration on GCE L4
    needs: provision
    runs-on: ubuntu-latest
    timeout-minutes: 300

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: cuda13-3
            name: CUDA 13.3
            os: linux
            os_name: Linux
            server_port_base: 10000
            cuda_version: 13.3.1
            cuda_short_version: "13.3"
            client_image: nvidia/cuda:13.3.1-devel-ubuntu24.04
            samples_ref: v13.3
            pytorch_index_url: https://download.pytorch.org/whl/cu132
            server_ld_library_path: /usr/local/cuda-13.3/compat
          - label: cuda12-4
            name: CUDA 12.4
            os: linux
            os_name: Linux
            server_port_base: 28000
            cuda_version: 12.4.1
            cuda_short_version: "12.4"
            client_image: nvidia/cuda:12.4.1-devel-ubuntu22.04
            samples_ref: v12.4.1
            pytorch_index_url: https://download.pytorch.org/whl/cu124
            server_ld_library_path: ""
          - label: cuda11-8
            name: CUDA 11.8
            os: linux
            os_name: Linux
            server_port_base: 46000
            cuda_version: 11.8.0
            cuda_short_version: "11.8"
            client_image: nvidia/cuda:11.8.0-devel-ubuntu22.04
            samples_ref: v11.8
            pytorch_index_url: https://download.pytorch.org/whl/cu118
            server_ld_library_path: ""
          - label: cuda13-3
            name: CUDA 13.3
            os: windows
            os_name: Windows
            server_port_base: 10000
            cuda_version: 13.3.1
            cuda_short_version: "13.3"
            samples_ref: v13.3
            pytorch_index_url: https://download.pytorch.org/whl/cu132
            cuda_flags: ""
            host_defines: ""
          - label: cuda12-4
            name: CUDA 12.4
            os: windows
            os_name: Windows
            server_port_base: 28000
            cuda_version: 12.4.1
            cuda_short_version: "12.4"
            samples_ref: v12.4.1
            pytorch_index_url: https://download.pytorch.org/whl/cu124
            cuda_flags: ""
            host_defines: ""
          - label: cuda11-8
            name: CUDA 11.8
            os: windows
            os_name: Windows
            server_port_base: 46000
            cuda_version: 11.8.0
            cuda_short_version: "11.8"
            samples_ref: v11.8
            pytorch_index_url: https://download.pytorch.org/whl/cu118
            cuda_flags: -allow-unsupported-compiler
            host_defines: /D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH

    env:
      GCP_PROJECT_ID: kevmo314
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/272419586516/locations/global/workloadIdentityPools/lupine-github/providers/github
      GCP_SERVICE_ACCOUNT: lupine-gpu-ci@kevmo314.iam.gserviceaccount.com
      GCP_BUILD_CACHE_BUCKET: kevmo314-lupine-gpu-integration-cache
      INTEGRATION_BINARY_CACHE_VERSION: v1
      GCP_NETWORK: default
      COMPLIANCE_TIMEOUT: 240m
      CUDA_SAMPLE_TIMEOUT: 120
      CUDA_LONG_SAMPLE_TIMEOUT: 600
      # Keep each lane's complete suite moving while the three CUDA lanes
      # intentionally share the same VM and GPU.
      CUDA_SAMPLE_JOBS: 8
      SSH_COMMAND_TIMEOUT: 120
      SERVER_LD_LIBRARY_PATH: ${{ matrix.server_ld_library_path }}
      VM_NAME: lupine-gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
      VM_TAG: lupine-gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
      FIREWALL_ALLOW_RULE: lupine-gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.label }}-allow
      CLIENT_IMAGE: lupine-gpu-integration:${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # google-github-actions/auth writes its generated ADC file into the
      # workspace. Move it before Docker packages the pull request checkout so
      # fork-controlled .dockerignore changes cannot add the credential file to
      # the remote build context.
      - name: Move Google Cloud credentials outside the build context
        run: |
          set -euo pipefail
          credentials_path="${GOOGLE_GHA_CREDS_PATH:?Google auth did not create credentials}"
          relocated_path="$RUNNER_TEMP/$(basename "$credentials_path")"
          mv "$credentials_path" "$relocated_path"
          chmod 600 "$relocated_path"
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$relocated_path"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$relocated_path"
            echo "GOOGLE_GHA_CREDS_PATH=$relocated_path"
            echo "LUPINE_GCP_CREDS_PATH=$relocated_path"
          } >> "$GITHUB_ENV"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure GCS build cache lifecycle
        if: github.event_name != 'pull_request' && matrix.os == 'linux' && matrix.label == 'cuda13-3'
        run: |
          set -euo pipefail
          bucket_name="${GCP_BUILD_CACHE_BUCKET#gs://}"
          bucket_name="${bucket_name%/}"
          lifecycle_file="$RUNNER_TEMP/gpu-integration-cache-lifecycle.json"
          cat > "$lifecycle_file" <<'JSON'
          {
            "rule": [
              {
                "action": { "type": "Delete" },
                "condition": {
                  "daysSinceCustomTime": 7,
                  "matchesPrefix": ["gpu-integration/binaries/"]
                }
              }
            ]
          }
          JSON
          gcloud storage buckets update "gs://$bucket_name" \
            --lifecycle-file="$lifecycle_file"

      - name: Download shared SSH credentials
        uses: actions/download-artifact@v8
        with:
          name: gpu-integration-ssh-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gce-ssh

      - name: Locate shared VM and prepare runner allowlist
        run: |
          set -euo pipefail
          chmod 700 "$RUNNER_TEMP/gce-ssh"
          chmod 600 "$RUNNER_TEMP/gce-ssh/id_ed25519"
          runner_ip="$(curl -fsS https://api.ipify.org)"
          test -n "$runner_ip"
          instance="$({
            gcloud compute instances list \
              --project="$GCP_PROJECT_ID" \
              --filter="name=('$VM_NAME') AND status=RUNNING" \
              --format='csv[no-heading](zone.basename(),networkInterfaces[0].accessConfigs[0].natIP)'
          } | head -n1)"
          IFS=, read -r zone vm_ip <<< "$instance"
          test -n "$zone"
          test -n "$vm_ip"
          {
            echo "SSH_DIR=$RUNNER_TEMP/gce-ssh"
            echo "RUNNER_IP=$runner_ip"
            echo "GCP_ZONE=$zone"
            echo "VM_IP=$vm_ip"
          } >> "$GITHUB_ENV"

      - name: Allow this lane to reach the shared VM
        run: |
          set -euo pipefail
          gcloud compute firewall-rules create "$FIREWALL_ALLOW_RULE" \
            --project="$GCP_PROJECT_ID" \
            --network="$GCP_NETWORK" \
            --direction=INGRESS \
            --priority=800 \
            --action=ALLOW \
            --rules=tcp:22 \
            --source-ranges="$RUNNER_IP/32" \
            --target-tags="$VM_TAG"

      - name: Write inline client image Dockerfile
        if: matrix.os == 'linux'
        run: |
          cat > "${RUNNER_TEMP}/gpu-integration.Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1.7

          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}

          ARG INTEGRATION_BINARY_CACHE_HIT=false
          ARG CUDA_SAMPLES_ARCH
          ENV DEBIAN_FRONTEND=noninteractive \
              CUDA_HOME=/usr/local/cuda \
              CUDA_LIB_DIR=/usr/local/cuda/lib64 \
              CUDA_SAMPLES_DIR=/opt/cuda-samples-src \
              CUDA_SAMPLES_BUILD_DIR=/opt/cuda-samples-build \
              CUDA_SAMPLES_ARCH=${CUDA_SAMPLES_ARCH} \
              CCACHE_DIR=/opt/lupine/ccache \
              CCACHE_BASEDIR=/src \
              CCACHE_COMPILERCHECK=content \
              CCACHE_COMPRESS=true \
              INTEGRATION_BINARY_CACHE_HIT=${INTEGRATION_BINARY_CACHE_HIT} \
              PATH=/usr/local/cuda/bin:$PATH

          RUN apt-get update && apt-get install -y --no-install-recommends \
                bash \
                build-essential \
                ca-certificates \
                ccache \
                cmake \
                curl \
                freeglut3-dev \
                git \
                gzip \
                libfreeimage-dev \
                libgl-dev \
                libglu1-mesa-dev \
                libnghttp2-dev \
                libx11-dev \
                libxi-dev \
                libxmu-dev \
                llvm-14-dev \
                ninja-build \
                openssh-client \
                python3 \
                python3-dev \
                python3-pip \
                python3-venv \
              && rm -rf /var/lib/apt/lists/*

          RUN bash <<'SCRIPT'
          set -euo pipefail

          if [[ "$INTEGRATION_BINARY_CACHE_HIT" == "true" ]]; then
            echo "Using restored integration binary cache"
            exit 0
          fi

          git clone --branch "${{ matrix.samples_ref }}" --depth 1 \
            https://github.com/NVIDIA/cuda-samples.git "$CUDA_SAMPLES_DIR"
          git config --global --add safe.directory "$CUDA_SAMPLES_DIR"

          if [[ -n "$CUDA_SAMPLES_ARCH" ]]; then
            find "$CUDA_SAMPLES_DIR" -name CMakeLists.txt -exec sed -i -E \
              "s/set\(CMAKE_CUDA_ARCHITECTURES ([0-9 ]* )?$CUDA_SAMPLES_ARCH( [0-9 ]*)?\)/set(CMAKE_CUDA_ARCHITECTURES $CUDA_SAMPLES_ARCH)/" {} +
          fi

          export LLVM_HOME=/usr/lib/llvm-14
          if [[ -f "$CUDA_SAMPLES_DIR/CMakeLists.txt" && ( -d "$CUDA_SAMPLES_DIR/cpp" || -d "$CUDA_SAMPLES_DIR/Samples" ) ]]; then
            cmake -S "$CUDA_SAMPLES_DIR" -B "$CUDA_SAMPLES_BUILD_DIR" \
              -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_CUDA_C_LINKING_SAMPLE=1
            cmake --build "$CUDA_SAMPLES_BUILD_DIR" --parallel "$(nproc)"
          else
            make -C "$CUDA_SAMPLES_DIR" -j"$(nproc)" ${CUDA_SAMPLES_ARCH:+SMS="$CUDA_SAMPLES_ARCH"}
          fi
          SCRIPT

          # CUDALibrarySamples are built once here; samples the lane's toolkit
          # cannot build are reported as SKIP:build-failed by the run step.
          COPY test/run_cuda_library_samples.sh /opt/lupine/run_cuda_library_samples.sh
          RUN if [ "$INTEGRATION_BINARY_CACHE_HIT" = "true" ]; then \
                echo "Using cached CUDALibrarySamples binaries"; \
              else \
                LIBRARY_SAMPLES_DIR=/opt/cuda-library-samples LIBRARY_SAMPLES_ARCH="$CUDA_SAMPLES_ARCH" \
                  BUILD_ONLY=1 bash /opt/lupine/run_cuda_library_samples.sh; \
              fi

          WORKDIR /src
          COPY . /src
          EOF

      - name: Wait for SSH and NVIDIA driver
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          ssh_base=(
            ssh
            -i "$SSH_DIR/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$SSH_DIR/known_hosts"
            -o ConnectTimeout=10
            "gha@$VM_IP"
          )

          for _ in $(seq 1 120); do
            if "${ssh_base[@]}" 'echo ready' >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          # shellcheck disable=SC2016
          "${ssh_base[@]}" '
            deadline=$((SECONDS + 1200))
            until command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "NVIDIA driver did not become ready before the timeout" >&2
                exit 1
              fi
              sleep 15
            done

            deadline=$((SECONDS + 300))
            until command -v docker >/dev/null 2>&1 &&
              sudo docker info >/dev/null 2>&1 &&
              test -f /var/lib/lupine-startup-complete; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "VM startup did not become ready before the timeout" >&2
                sudo systemctl status --no-pager google-startup-scripts.service || true
                sudo journalctl --no-pager -n 100 \
                  -u google-startup-scripts.service || true
                exit 1
              fi
              sleep 5
            done
            sudo usermod -aG docker gha
          '

          arch="$("${ssh_base[@]}" 'nvidia-smi --query-gpu=compute_cap --format=csv,noheader' \
            | tr -d '. ' | sort -u | xargs)"
          test -n "$arch"
          echo "CUDA_SAMPLES_ARCH=$arch" >> "$GITHUB_ENV"

      - name: Restore integration binary cache from GCS
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          ssh_base=(
            ssh
            -i "$SSH_DIR/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_DIR/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            "gha@$VM_IP"
          )

          dockerfile_sha="$(
            sha256sum "$RUNNER_TEMP/gpu-integration.Dockerfile" | cut -d' ' -f1
          )"
          cache_inputs="$(
            {
              printf '%s\n' \
                "$INTEGRATION_BINARY_CACHE_VERSION" \
                "base-image=${{ matrix.client_image }}" \
                "dockerfile=$dockerfile_sha"
              git ls-files -s -- \
                test/run_cuda_library_samples.sh
            } | sha256sum | cut -d' ' -f1
          )"
          cache_hit=false
          cache_uri=""
          remote_cache_dir="/home/gha/lupine-integration-binaries-${{ matrix.label }}"
          remote_cache_archive="${remote_cache_dir}.tar.gz"

          "${ssh_base[@]}" \
            "rm -rf '$remote_cache_dir' '$remote_cache_archive'; mkdir -p '$remote_cache_dir'"

          cache_prefix="gpu-integration/binaries/$INTEGRATION_BINARY_CACHE_VERSION/cuda-${{ matrix.cuda_version }}/sm-$CUDA_SAMPLES_ARCH"
          cache_uri="gs://$GCP_BUILD_CACHE_BUCKET/$cache_prefix/inputs-$cache_inputs.tar.gz"
          expected_sha="$(
            gcloud storage objects describe "$cache_uri" \
              --raw \
              --format='value(metadata.sha256)' 2>/dev/null || true
          )"

          if [[ -n "$expected_sha" ]] && \
            gcloud storage cp "$cache_uri" - | \
              "${ssh_base[@]}" "cat > '$remote_cache_archive'"; then
            actual_sha="$(
              "${ssh_base[@]}" \
                "sha256sum '$remote_cache_archive' | cut -d' ' -f1"
            )"
            if [[ "$actual_sha" == "$expected_sha" ]] && \
              "${ssh_base[@]}" "
                set -euo pipefail
                tar -xzf '$remote_cache_archive' -C '$remote_cache_dir'
                rm -f '$remote_cache_archive'
                test -d '$remote_cache_dir/cuda-samples-src'
                test -d '$remote_cache_dir/cuda-library-samples'
              "; then
              cache_hit=true
              gcloud storage objects update "$cache_uri" \
                --custom-time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Restored integration binaries from $cache_uri"
            fi
          fi

          if [[ "$cache_hit" != "true" ]]; then
            echo "No valid integration binary cache found at $cache_uri"
            "${ssh_base[@]}" \
              "rm -rf '$remote_cache_dir' '$remote_cache_archive'; mkdir -p '$remote_cache_dir'"
          fi

          {
            echo "INTEGRATION_BINARY_CACHE_HIT=$cache_hit"
            echo "INTEGRATION_BINARY_CACHE_REMOTE_ARCHIVE=$remote_cache_archive"
            echo "INTEGRATION_BINARY_CACHE_REMOTE_DIR=$remote_cache_dir"
            echo "INTEGRATION_BINARY_CACHE_URI=$cache_uri"
          } >> "$GITHUB_ENV"

      - name: Build ${{ matrix.name }} client image on L4 VM
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          # The docker CLI reaches the VM daemon over SSH and ships only the
          # build context, so the multi-GB image never crosses the wire. It
          # takes SSH options from ~/.ssh/config only.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host lupine-gpu-vm
            HostName $VM_IP
            User gha
            IdentityFile $SSH_DIR/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $SSH_DIR/known_hosts
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

          start=$SECONDS
          DOCKER_HOST=ssh://lupine-gpu-vm docker build \
            --progress=plain \
            --file "${RUNNER_TEMP}/gpu-integration.Dockerfile" \
            --tag "$CLIENT_IMAGE" \
            --build-arg "BASE_IMAGE=${{ matrix.client_image }}" \
            --build-arg "CUDA_SAMPLES_ARCH=$CUDA_SAMPLES_ARCH" \
            --build-arg "INTEGRATION_BINARY_CACHE_HIT=$INTEGRATION_BINARY_CACHE_HIT" \
            .
          echo "Built $CLIENT_IMAGE on L4 VM in $((SECONDS - start))s"

      - name: Run ${{ matrix.name }} client inside L4 VM
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail

          if [[ -e /dev/nvidiactl || -e /dev/nvidia0 ]]; then
            echo "local NVIDIA device is visible on the GitHub runner; client/server separation is invalid" >&2
            exit 1
          fi
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
            echo "local NVIDIA GPU is visible on the GitHub runner; client/server separation is invalid" >&2
            exit 1
          fi

          ssh_base=(
            ssh
            -i "$SSH_DIR/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_DIR/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            "gha@$VM_IP"
          )
          scp_base=(
            scp
            -i "$SSH_DIR/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_DIR/known_hosts"
          )

          remote_ssh="/home/gha/lupine-ssh-${{ matrix.label }}"
          remote_results="/home/gha/lupine-results-${{ matrix.label }}"
          "${ssh_base[@]}" "rm -rf '$remote_results' '$remote_ssh'; mkdir -p '$remote_results' '$remote_ssh'"
          "${scp_base[@]}" "$SSH_DIR/id_ed25519" "$SSH_DIR/known_hosts" "gha@$VM_IP:$remote_ssh/"
          "${ssh_base[@]}" "chmod 700 '$remote_ssh'; chmod 600 '$remote_ssh/id_ed25519'"

          remote_status=0
          "${ssh_base[@]}" \
            "CLIENT_IMAGE='$CLIENT_IMAGE' CUDA_SAMPLE_JOBS='$CUDA_SAMPLE_JOBS' CUDA_SAMPLE_TIMEOUT='$CUDA_SAMPLE_TIMEOUT' CUDA_LONG_SAMPLE_TIMEOUT='$CUDA_LONG_SAMPLE_TIMEOUT' SSH_COMMAND_TIMEOUT='$SSH_COMMAND_TIMEOUT' COMPLIANCE_TIMEOUT='$COMPLIANCE_TIMEOUT' PYTORCH_INDEX_URL='${{ matrix.pytorch_index_url }}' SERVER_LD_LIBRARY_PATH='$SERVER_LD_LIBRARY_PATH' SERVER_PORT_BASE='${{ matrix.server_port_base }}' INTEGRATION_BINARY_CACHE_HIT='$INTEGRATION_BINARY_CACHE_HIT' INTEGRATION_BINARY_CACHE_REMOTE_DIR='$INTEGRATION_BINARY_CACHE_REMOTE_DIR' MATRIX_LABEL='${{ matrix.label }}' GITHUB_RUN_ID='${GITHUB_RUN_ID:-local}' GITHUB_RUN_ATTEMPT='${GITHUB_RUN_ATTEMPT:-1}' bash -s" <<'REMOTE' || remote_status=$?
          set -euo pipefail
          cache_mounts=()
          if [[ "$INTEGRATION_BINARY_CACHE_HIT" == "true" ]]; then
            cache_mounts+=(
              -v "$INTEGRATION_BINARY_CACHE_REMOTE_DIR/cuda-samples-src:/opt/cuda-samples-src"
              -v "$INTEGRATION_BINARY_CACHE_REMOTE_DIR/cuda-library-samples:/opt/cuda-library-samples"
            )
            if [[ -d "$INTEGRATION_BINARY_CACHE_REMOTE_DIR/cuda-samples-build" ]]; then
              cache_mounts+=(
                -v "$INTEGRATION_BINARY_CACHE_REMOTE_DIR/cuda-samples-build:/opt/cuda-samples-build"
              )
            fi
          fi
          sudo docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e CUDA_SAMPLE_JOBS="$CUDA_SAMPLE_JOBS" \
            -e CUDA_SAMPLE_TIMEOUT="$CUDA_SAMPLE_TIMEOUT" \
            -e CUDA_LONG_SAMPLE_TIMEOUT="$CUDA_LONG_SAMPLE_TIMEOUT" \
            -e SSH_COMMAND_TIMEOUT="$SSH_COMMAND_TIMEOUT" \
            -e COMPLIANCE_TIMEOUT="$COMPLIANCE_TIMEOUT" \
            -e PYTORCH_INDEX_URL="$PYTORCH_INDEX_URL" \
            -e SERVER_LD_LIBRARY_PATH="$SERVER_LD_LIBRARY_PATH" \
            -e SERVER_PORT_BASE="$SERVER_PORT_BASE" \
            -e SERVER_HOST=host.docker.internal \
            -e SERVER_USER=gha \
            -e SERVER_SSH_TARGET=gha@host.docker.internal \
            -e MATRIX_LABEL="$MATRIX_LABEL" \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -v /home/gha/lupine-ssh-"$MATRIX_LABEL":/ssh:ro \
            -v /home/gha/lupine-results-"$MATRIX_LABEL":/results \
            "${cache_mounts[@]}" \
            "$CLIENT_IMAGE" \
            bash -lc '
              set -euo pipefail
              if [[ -e /dev/nvidiactl || -e /dev/nvidia0 ]]; then
                echo "NVIDIA device is visible inside the client container; client/server separation is invalid" >&2
                exit 1
              fi
              if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
                echo "NVIDIA GPU is visible inside the client container; client/server separation is invalid" >&2
                exit 1
              fi

              mkdir -p /tmp/lupine-ssh
              cp /ssh/id_ed25519 /tmp/lupine-ssh/id_ed25519
              cp /ssh/known_hosts /tmp/lupine-ssh/known_hosts
              chmod 700 /tmp/lupine-ssh
              chmod 600 /tmp/lupine-ssh/id_ed25519

              export CUDA_HOME=/usr/local/cuda
              export CUDA_LIB_DIR=/usr/local/cuda/lib64
              export PATH=/usr/local/cuda/bin:$PATH
              export REPO_ROOT=/src
              export LUPINE_BUILD_DIR=/tmp/lupine-build
              export CCACHE_DIR=/tmp/lupine-ccache
              mkdir -p "$LUPINE_BUILD_DIR" "$CCACHE_DIR"
              export CCACHE_BASEDIR=/src
              export CCACHE_COMPILERCHECK=content
              export CCACHE_COMPRESS=true
              export LUPINE_LIB="$LUPINE_BUILD_DIR/libcuda.so.1"
              export LUPINE_DISABLE_LOCAL=1
              export SERVER_LOCAL_BIN="$LUPINE_BUILD_DIR/lupine_driver_server"
              export SERVER_REMOTE_BIN="/tmp/lupine-driver-server-${MATRIX_LABEL}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              export SSH_OPTS="-i /tmp/lupine-ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
              export SAMPLE_TIMEOUT="$CUDA_SAMPLE_TIMEOUT"
              export LONG_SAMPLE_TIMEOUT="$CUDA_LONG_SAMPLE_TIMEOUT"
              export CUDA_SAMPLES_DIR=/opt/cuda-samples-src
              export CUDA_SAMPLES_BUILD_DIR=/opt/cuda-samples-build
              export CUDA_PYTHON_DIR=/tmp/cuda-python
              export LIBRARY_SAMPLES_DIR=/opt/cuda-library-samples

              python3 -m venv /tmp/venv-pytorch
              /tmp/venv-pytorch/bin/pip install --upgrade pip >/dev/null
              /tmp/venv-pytorch/bin/pip install numpy >/dev/null
              /tmp/venv-pytorch/bin/pip install --index-url "$PYTORCH_INDEX_URL" torch >/dev/null
              export PYTHON_BIN=/tmp/venv-pytorch/bin/python

              cmake -S /src -B "$LUPINE_BUILD_DIR" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCUDAToolkit_ROOT="$CUDA_HOME" \
                -DCMAKE_LIBRARY_PATH="$CUDA_HOME/lib64/stubs" \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
              cmake --build "$LUPINE_BUILD_DIR" --parallel \
                --target lupine_cuda_client lupine_nvml_client lupine_driver_server
              ln -sf libcuda.so.1 "$LUPINE_BUILD_DIR/libcuda.so"
              ln -sf libnvidia-ml.so.1 "$LUPINE_BUILD_DIR/libnvidia-ml.so"

              # shellcheck disable=SC2206
              ssh_args=($SSH_OPTS)
              timeout --kill-after=5s "$SSH_COMMAND_TIMEOUT" \
                scp -q "${ssh_args[@]}" "$SERVER_LOCAL_BIN" \
                  "$SERVER_SSH_TARGET:$SERVER_REMOTE_BIN"

              # This sample hard-codes GPUs {0, 1}, while the GCE lane exposes
              # one L4. Keep it enabled for two-GPU runs outside this workflow.
              export LIBRARY_SAMPLES_SKIP_LIST="cuFFT/3d_mgpu_c2c/bin/3d_mgpu_c2c_example"
              export INTEGRATION_RESULTS_DIR="/results/test/integration/results/$(date +%Y%m%d-%H%M%S)"
              mkdir -p "$INTEGRATION_RESULTS_DIR"
              cmake -S /src/test/integration -B /tmp/lupine-integration-ctest
              timeout --kill-after=30s "$COMPLIANCE_TIMEOUT" \
                ctest --test-dir /tmp/lupine-integration-ctest \
                  --parallel "$CUDA_SAMPLE_JOBS" \
                  --output-on-failure \
                  --output-log "$INTEGRATION_RESULTS_DIR/ctest.log" \
                  --output-junit "$INTEGRATION_RESULTS_DIR/junit.xml"
            '
          REMOTE

          results_tgz="$RUNNER_TEMP/gpu-results-${{ matrix.label }}.tgz"
          "${ssh_base[@]}" "cd '$remote_results' && [ -d test ] && tar -czf - test || true" > "$results_tgz"
          if [[ -s "$results_tgz" ]]; then
            tar -xzf "$results_tgz"
          fi

          exit "$remote_status"

      - name: Run ${{ matrix.name }} native Windows integration suite
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          ssh_base=(
            ssh
            -i "$SSH_DIR/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$SSH_DIR/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            "gha@$VM_IP"
          )
          scp_base=(
            scp
            -i "$SSH_DIR/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_DIR/known_hosts"
          )
          run_powershell() {
            local source="$1"
            local encoded
            encoded="$(printf '%s' "$source" | iconv -f utf-8 -t utf-16le | base64 -w0)"
            "${ssh_base[@]}" \
              '"C:\Program Files\PowerShell\7\pwsh.exe"' \
              "-NoProfile -NonInteractive -EncodedCommand $encoded"
          }

          source_archive="$RUNNER_TEMP/lupine-source-${{ matrix.label }}.zip"
          git archive --format=zip --output="$source_archive" HEAD
          "${scp_base[@]}" "$source_archive" \
            "gha@$VM_IP:source-${{ matrix.label }}.zip"

          setup_script="$(cat <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $source = 'C:\lupine\${{ matrix.label }}'
          $archive = Join-Path $env:USERPROFILE 'source-${{ matrix.label }}.zip'
          Remove-Item $source -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $source | Out-Null
          Expand-Archive -Path $archive -DestinationPath $source -Force
          POWERSHELL
          )"
          run_powershell "$setup_script"

          test_script="$(cat <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $source = 'C:\lupine\${{ matrix.label }}'
          $results = 'C:\lupine-results\${{ matrix.label }}'
          New-Item -ItemType Directory -Force $results | Out-Null
          Start-Transcript -Path (Join-Path $results 'run.log') -Force
          try {
            & (Join-Path $source 'test\run_windows_integration.ps1') `
              -CudaVersion '${{ matrix.cuda_version }}' `
              -CudaShortVersion '${{ matrix.cuda_short_version }}' `
              -CudaSamplesRef '${{ matrix.samples_ref }}' `
              -PytorchIndexUrl '${{ matrix.pytorch_index_url }}' `
              -ServerPortBase ${{ matrix.server_port_base }} `
              -ResultsDirectory $results `
              -CudaFlags '${{ matrix.cuda_flags }}' `
              -HostDefines '${{ matrix.host_defines }}'
          } finally {
            Stop-Transcript
          }
          POWERSHELL
          )"
          remote_status=0
          run_powershell "$test_script" || remote_status=$?

          collect_script="$(cat <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $results = 'C:\lupine-results\${{ matrix.label }}'
          $archive = Join-Path $env:USERPROFILE 'results-${{ matrix.label }}.zip'
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          if (Test-Path $results) {
            Compress-Archive -Path "$results\*" -DestinationPath $archive -Force
          }
          POWERSHELL
          )"
          run_powershell "$collect_script" || true
          local_results="test/integration/results/${{ matrix.label }}"
          mkdir -p "$local_results"
          if "${scp_base[@]}" "gha@$VM_IP:results-${{ matrix.label }}.zip" \
            "$RUNNER_TEMP/results-${{ matrix.label }}.zip"; then
            unzip -q "$RUNNER_TEMP/results-${{ matrix.label }}.zip" -d "$local_results"
          fi

          exit "$remote_status"

      - name: Refresh Google Cloud credentials for cache upload
        if: matrix.os == 'linux' && github.event_name != 'pull_request' && env.INTEGRATION_BINARY_CACHE_HIT != 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Save integration binary cache to GCS
        if: matrix.os == 'linux' && github.event_name != 'pull_request' && env.INTEGRATION_BINARY_CACHE_HIT != 'true'
        run: |
          set -euo pipefail
          ssh_base=(
            ssh
            -i "$SSH_DIR/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_DIR/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            "gha@$VM_IP"
          )

          "${ssh_base[@]}" \
            "CLIENT_IMAGE='$CLIENT_IMAGE' CACHE_ARCHIVE='$INTEGRATION_BINARY_CACHE_REMOTE_ARCHIVE' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo docker run --rm --entrypoint bash "$CLIENT_IMAGE" -lc '
            set -euo pipefail
            cache_paths=(cuda-samples-src cuda-library-samples)
            if [[ -d /opt/cuda-samples-build ]]; then
              cache_paths+=(cuda-samples-build)
            fi
            tar -C /opt -cf - "${cache_paths[@]}" | gzip -1
          ' > "$CACHE_ARCHIVE"
          test -s "$CACHE_ARCHIVE"
          REMOTE

          archive_sha="$(
            "${ssh_base[@]}" \
              "sha256sum '$INTEGRATION_BINARY_CACHE_REMOTE_ARCHIVE' | cut -d' ' -f1"
          )"
          upload_status=0
          "${ssh_base[@]}" "cat '$INTEGRATION_BINARY_CACHE_REMOTE_ARCHIVE'" | \
            gcloud storage cp - "$INTEGRATION_BINARY_CACHE_URI" \
              --content-type=application/gzip \
              --custom-metadata="sha256=$archive_sha" \
              --custom-time="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            || upload_status=$?
          "${ssh_base[@]}" "rm -f '$INTEGRATION_BINARY_CACHE_REMOTE_ARCHIVE'"
          if [[ "$upload_status" -ne 0 ]]; then
            exit "$upload_status"
          fi
          echo "Saved integration binaries to $INTEGRATION_BINARY_CACHE_URI"

      - name: Publish integration test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: GPU integration (${{ matrix.os }}-${{ matrix.label }})
          path: test/integration/results/*/junit.xml
          reporter: java-junit
          fail-on-empty: false

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-integration-results-${{ matrix.os }}-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/integration/results/
          if-no-files-found: ignore

      - name: Remove lane firewall rule
        if: always()
        run: |
          set -euo pipefail
          gcloud compute firewall-rules delete "$FIREWALL_ALLOW_RULE" \
            --project="$GCP_PROJECT_ID" --quiet || true

      - name: Remove relocated Google Cloud credentials
        if: always()
        run: rm -f -- "$LUPINE_GCP_CREDS_PATH"

  cleanup:
    name: Tear down shared GPU VMs
    needs: [provision, gpu-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: kevmo314
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/272419586516/locations/global/workloadIdentityPools/lupine-github/providers/github
      GCP_SERVICE_ACCOUNT: lupine-gpu-ci@kevmo314.iam.gserviceaccount.com
      RESOURCE_PREFIX: lupine-gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Delete VMs and firewall rules
        run: |
          set -euo pipefail
          delete_pids=()
          while IFS=, read -r name zone; do
            [[ -n "$name" && -n "$zone" ]] || continue
            gcloud compute instances delete "$name" \
              --project="$GCP_PROJECT_ID" --zone="$zone" --quiet &
            delete_pids+=("$!")
          done < <(
            gcloud compute instances list \
              --project="$GCP_PROJECT_ID" \
              --filter="name~'^${RESOURCE_PREFIX}-(linux|windows)$'" \
              --format='csv[no-heading](name,zone.basename())'
          )
          while IFS= read -r rule; do
            [[ -n "$rule" ]] || continue
            gcloud compute firewall-rules delete "$rule" \
              --project="$GCP_PROJECT_ID" --quiet &
            delete_pids+=("$!")
          done < <(
            gcloud compute firewall-rules list \
              --project="$GCP_PROJECT_ID" \
              --filter="name~'^${RESOURCE_PREFIX}-'" \
              --format='value(name)'
          )
          for pid in "${delete_pids[@]}"; do
            wait "$pid" || true
          done

          leftover_vms="$(
            gcloud compute instances list \
              --project="$GCP_PROJECT_ID" \
              --filter="name~'^${RESOURCE_PREFIX}-(linux|windows)$'" \
              --format='value(name)'
          )"
          leftover_rules="$(
            gcloud compute firewall-rules list \
              --project="$GCP_PROJECT_ID" \
              --filter="name~'^${RESOURCE_PREFIX}-'" \
              --format='value(name)'
          )"
          if [[ -n "$leftover_vms$leftover_rules" ]]; then
            echo "GCE cleanup left resources behind:" >&2
            printf '%s\n%s\n' "$leftover_vms" "$leftover_rules" >&2
            exit 1
          fi
