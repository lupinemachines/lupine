name: Build HIP

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-clients:
    name: Build all native client variants
    uses: ./.github/workflows/native-clients.yml

  unified-images:
    name: Unified CUDA + HIP images
    needs: native-clients
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download all native client variants
        uses: actions/download-artifact@v8
        with:
          pattern: lupine-client-*
          path: client-libs
          merge-multiple: false

      - name: Build unified client and server images
        run: |
          set -euo pipefail
          docker build --target client -t lupine-client .
          docker build \
            --target server \
            --build-arg LUPINE_CLIENT_BUNDLE_INPUT=/opt/lupine/client-libs \
            -t lupine-server \
            .

      - name: Verify SDK-free client artifacts
        run: |
          docker run --rm --entrypoint bash lupine-client -lc '
            set -euo pipefail
            test -e /opt/lupine/lib/libcuda.so.1
            test -e /opt/lupine/lib/libnvidia-ml.so.1
            test -e /opt/lupine/lib/libamdhip64.so.1
            test ! -d /usr/local/cuda
            test ! -d /opt/rocm
          '

      - name: Verify unified server runtimes
        run: |
          docker run --rm --entrypoint bash lupine-server -lc '
            set -euo pipefail
            test -x /opt/lupine/bin/lupine_driver_server
            test ! -e /opt/lupine/client-bundles
            test -e /usr/local/cuda/compat/libcuda.so.1
            test -e /opt/rocm/lib/libamdhip64.so
            ! ldd /opt/lupine/bin/lupine_driver_server | grep -q "not found"
          '
