name: Build HIP (AMD)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hip:
    name: HIP client + HIP-enabled server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build HIP client + HIP-enabled server
        run: |
          docker build \
            -f Dockerfile.hip \
            --build-arg CUDA_VERSION=13.1.0 \
            -t lupine-hip:cuda-13.1.0 \
            .

      - name: Verify build artifacts
        run: |
          docker run --rm --entrypoint bash lupine-hip:cuda-13.1.0 -lc '
            set -euo pipefail
            test -x /opt/lupine/build/lupine_driver_server
            test -e /opt/lupine/build/libamdhip64.so.1
          '