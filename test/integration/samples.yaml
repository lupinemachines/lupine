# Pinned CUDA 12.4.1 samples. They run through the driver shim with the upstream
# CUDA runtime, exactly as the existing driver-only compliance suite does.
revision: 5f97d7d0dff880bc6567faa4c5e62e389a6d6999
# This pinned set's upstream Makefiles waive SBSA/ARM builds. ARM clients run
# the portable driver workloads; reject unsupported sample selections early.
architectures: [x86_64]
samples:
  simpleP2P:
    source: 0_Introduction/simpleP2P
    peer_waiver: Peer to Peer access is not available amongst GPUs in the system, waiving test.
  p2pBandwidthLatencyTest:
    source: 5_Domain_Specific/p2pBandwidthLatencyTest
    args: [--numElems=262144]
    timeout: 180
  streamOrderedAllocationP2P:
    source: 2_Concepts_and_Techniques/streamOrderedAllocationP2P
    peer_waiver: No Two or more Devices p2p capable found.. exiting..
  simpleMultiGPU:
    source: 0_Introduction/simpleMultiGPU
  MonteCarloMultiGPU:
    source: 5_Domain_Specific/MonteCarloMultiGPU
    timeout: 180
  simpleCUFFT_MGPU:
    source: 4_CUDA_Libraries/simpleCUFFT_MGPU
  simpleCUFFT_2d_MGPU:
    source: 4_CUDA_Libraries/simpleCUFFT_2d_MGPU
  conjugateGradientMultiDeviceCG:
    source: 4_CUDA_Libraries/conjugateGradientMultiDeviceCG
    timeout: 180
